server:
  port: 8080

spring:
  application:
    name: zhufeng-chat
  datasource:
    # H2 file database in MySQL compatibility mode - runs out of the box.
    # To switch to MySQL, replace with:
    #   url: jdbc:mysql://localhost:3306/zhufeng_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    #   driver-class-name: com.mysql.cj.jdbc.Driver
    # and add the mysql-connector-j dependency.
    url: jdbc:mysql://localhost:3306/video_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    secret: zhufeng-chat-clone-secret-key-change-in-production
    expire-hours: 168
  balance:
    start: 100000
