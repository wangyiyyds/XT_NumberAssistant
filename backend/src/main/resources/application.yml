# 公共配置：只放与环境无关的内容，数据源/密钥/日志等在各环境 profile 文件中配置
server:
  port: 8080

spring:
  application:
    name: xianting-chat
  profiles:
    # 默认开发环境，启动时可用 --spring.profiles.active=prod 覆盖
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    default-property-inclusion: non_null
  mvc:
    async:
      # Flux/SSE 走 Servlet 异步，超时与 ChatController 的 SseEmitter(120_000L) 对齐
      request-timeout: 120000
  ai:
    deepseek:
      # 用 ${} 语法读取你在 IDEA 里配置的环境变量
      api-key: ${DEEPSEEK_API_KEY}
      # 指定 DeepSeek 的官方请求地址
      base-url: https://api.deepseek.com
      chat:
        options:
          # 使用的模型名称，通常用 deepseek-chat
          model: deepseek-chat
          # 温度（0.0-1.0），越低越严谨，越高越有创造力
          temperature: 0.7

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    expire-hours: 168
  balance:
    start: 100000
  video-transcription:
    # 本地小模型服务接收 {"url":"https://..."}，返回 {"text":"..."}；也兼容 transcript/copywriting/content 字段。
    # 返回的原始转写会再由 spring.ai.deepseek 配置的模型做保真校对。
    url: ${VIDEO_TRANSCRIPTION_URL:http://127.0.0.1:8091/transcribe}
    api-key: ${VIDEO_TRANSCRIPTION_API_KEY:}

# swagger-ui 路径（是否启用由 profile 控制）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
