# 生产环境：连接与密钥一律来自环境变量（无默认值，缺失则启动失败，防止误用演示配置）；
# 关闭建表脚本、Swagger 与调试日志
spring:
  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  sql:
    init:
      mode: never

logging:
  level:
    root: warn
    com.xianting.chat: info

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
