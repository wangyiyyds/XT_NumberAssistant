# 测试环境：独立库 video_assistant_test，连接参数支持环境变量覆盖
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/video_assistant_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

logging:
  level:
    com.xianting.chat: info

app:
  jwt:
    secret: ${JWT_SECRET:xianting-chat-test-secret-only-for-testing}
