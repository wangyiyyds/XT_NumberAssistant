services:
  postgres:
    image: postgres:16-alpine
    container_name: xianting-chat-postgres
    environment:
      POSTGRES_DB: xianting_chat
      POSTGRES_USER: xianting
      POSTGRES_PASSWORD: xianting
      TZ: Asia/Shanghai
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    ports:
      - "5433:5432"
    volumes:
      - xianting_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xianting -d xianting_chat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  xianting_pgdata: