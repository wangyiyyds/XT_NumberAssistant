# 开发环境：与客户端 backend 共用同一个 MySQL 库 video_assistant
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/video_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
  sql:
    init:
      mode: always
      # 只执行管理端自己的建表脚本（幂等），客户端的 schema.sql 由 backend 维护
      schema-locations: classpath:schema-manage.sql

logging:
  level:
    com.xianting.manage: debug

app:
  jwt:
    # 必须与客户端 backend 的密钥不同：两端 token 载荷分别是 adminId / userId，
    # 若共用密钥，客户端用户的 token 能通过管理端验签并被当成管理员身份（串号漏洞）
    secret: xianting-manage-secret-key-change-in-production
